name: Build SupportGPT AI Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build project structure
        shell: bash
        run: |
          set -e

          mkdir -p assets
          mkdir -p data
          mkdir -p notebooks
          mkdir -p src/supportgpt
          mkdir -p tests

          # =========================================================
          # MOVE EXISTING NOTEBOOK
          # =========================================================

          NOTEBOOK="$(find . -maxdepth 1 -type f -name '*.ipynb' | head -n 1 || true)"

          if [ -n "$NOTEBOOK" ]; then
            mv "$NOTEBOOK" notebooks/tech_support_chatbot.ipynb
          fi

          # =========================================================
          # PACKAGE INIT
          # =========================================================

          cat > src/supportgpt/__init__.py <<'PYEOF'
          """
          SupportGPT AI

          Lightweight technical-support assistant with:
          - intent detection
          - knowledge-base retrieval
          - troubleshooting responses
          - escalation decisions
          """

          __version__ = "1.0.0"
          PYEOF

          # =========================================================
          # CONFIG
          # =========================================================

          cat > src/supportgpt/config.py <<'PYEOF'
          from pathlib import Path

          PROJECT_ROOT = Path(__file__).resolve().parents[2]

          DATA_DIR = PROJECT_ROOT / "data"

          DEFAULT_KNOWLEDGE_BASE = (
              DATA_DIR / "knowledge_base.json"
          )

          DEFAULT_TOP_K = 3

          ESCALATION_THRESHOLD = 0.18
          PYEOF

          # =========================================================
          # INTENT DETECTION
          # =========================================================

          cat > src/supportgpt/intent.py <<'PYEOF'
          """
          Lightweight intent detection.

          Designed as a deterministic baseline that can later be
          replaced by an ML classifier or LLM-based router.
          """

          INTENT_KEYWORDS = {
              "installation": {
                  "install",
                  "installation",
                  "installer",
                  "setup",
                  "dependency",
                  "dependencies",
              },

              "bug_error": {
                  "bug",
                  "error",
                  "crash",
                  "failed",
                  "failure",
                  "exception",
                  "broken",
              },

              "configuration": {
                  "configure",
                  "configuration",
                  "setting",
                  "settings",
                  "environment",
                  "config",
              },

              "api_support": {
                  "api",
                  "endpoint",
                  "token",
                  "request",
                  "integration",
                  "webhook",
                  "authentication",
              },

              "performance": {
                  "slow",
                  "performance",
                  "latency",
                  "memory",
                  "cpu",
                  "timeout",
                  "lag",
              },

              "account": {
                  "password",
                  "login",
                  "account",
                  "username",
                  "reset",
                  "credential",
              },
          }


          def detect_intent(text: str) -> str:
              normalized = (
                  text.lower()
                  .replace("/", " ")
                  .replace("-", " ")
              )

              tokens = set(
                  normalized.split()
              )

              best_intent = "general"
              best_score = 0

              for intent, keywords in (
                  INTENT_KEYWORDS.items()
              ):
                  score = len(
                      tokens.intersection(
                          keywords
                      )
                  )

                  if score > best_score:
                      best_score = score
                      best_intent = intent

              return best_intent
          PYEOF

          # =========================================================
          # KNOWLEDGE BASE
          # =========================================================

          cat > src/supportgpt/knowledge_base.py <<'PYEOF'
          """
          Knowledge-base loading and validation.
          """

          import json
          from pathlib import Path


          REQUIRED_FIELDS = {
              "id",
              "title",
              "category",
              "keywords",
              "summary",
              "steps",
          }


          def load_knowledge_base(path):
              path = Path(path)

              if not path.exists():
                  raise FileNotFoundError(
                      f"Knowledge base not found: {path}"
                  )

              with path.open(
                  "r",
                  encoding="utf-8",
              ) as file:
                  articles = json.load(file)

              if not isinstance(
                  articles,
                  list,
              ):
                  raise ValueError(
                      "Knowledge base must contain "
                      "a JSON list."
                  )

              for article in articles:
                  missing = (
                      REQUIRED_FIELDS
                      - set(article.keys())
                  )

                  if missing:
                      raise ValueError(
                          "Knowledge article is missing "
                          f"fields: {sorted(missing)}"
                      )

              return articles
          PYEOF

          # =========================================================
          # RETRIEVAL
          # =========================================================

          cat > src/supportgpt/retrieval.py <<'PYEOF'
          """
          TF-IDF knowledge retrieval.

          This keeps the baseline project:
          - local
          - reproducible
          - API-key free
          - easy to extend to embeddings / RAG later
          """

          from dataclasses import dataclass

          from sklearn.feature_extraction.text import (
              TfidfVectorizer,
          )

          from sklearn.metrics.pairwise import (
              cosine_similarity,
          )


          @dataclass
          class SearchResult:
              article: dict
              score: float


          class KnowledgeRetriever:

              def __init__(self, articles):
                  self.articles = articles

                  self.documents = [
                      self._article_to_text(article)
                      for article in articles
                  ]

                  self.vectorizer = (
                      TfidfVectorizer(
                          stop_words="english",
                          ngram_range=(1, 2),
                      )
                  )

                  self.matrix = (
                      self.vectorizer.fit_transform(
                          self.documents
                      )
                  )


              @staticmethod
              def _article_to_text(article):
                  return " ".join(
                      [
                          article["title"],
                          article["category"],
                          " ".join(
                              article["keywords"]
                          ),
                          article["summary"],
                          " ".join(
                              article["steps"]
                          ),
                      ]
                  )


              def search(
                  self,
                  query,
                  top_k=3,
              ):
                  query_vector = (
                      self.vectorizer.transform(
                          [query]
                      )
                  )

                  scores = cosine_similarity(
                      query_vector,
                      self.matrix,
                  )[0]

                  ranking = (
                      scores.argsort()[::-1]
                  )

                  results = []

                  for index in ranking[
                      :top_k
                  ]:
                      results.append(
                          SearchResult(
                              article=(
                                  self.articles[
                                      int(index)
                                  ]
                              ),
                              score=float(
                                  scores[
                                      int(index)
                                  ]
                              ),
                          )
                      )

                  return results
          PYEOF

          # =========================================================
          # SUPPORT ENGINE
          # =========================================================

          cat > src/supportgpt/engine.py <<'PYEOF'
          """
          Core SupportGPT response engine.
          """

          from .config import (
              DEFAULT_KNOWLEDGE_BASE,
              DEFAULT_TOP_K,
              ESCALATION_THRESHOLD,
          )

          from .intent import detect_intent

          from .knowledge_base import (
              load_knowledge_base,
          )

          from .retrieval import (
              KnowledgeRetriever,
          )


          class SupportEngine:

              def __init__(
                  self,
                  knowledge_base_path=(
                      DEFAULT_KNOWLEDGE_BASE
                  ),
              ):
                  self.articles = (
                      load_knowledge_base(
                          knowledge_base_path
                      )
                  )

                  self.retriever = (
                      KnowledgeRetriever(
                          self.articles
                      )
                  )


              def answer(
                  self,
                  query,
                  top_k=DEFAULT_TOP_K,
              ):
                  if not query.strip():
                      raise ValueError(
                          "Query cannot be empty."
                      )

                  intent = detect_intent(
                      query
                  )

                  results = (
                      self.retriever.search(
                          query,
                          top_k=top_k,
                      )
                  )

                  best = results[0]

                  article = best.article

                  confidence = max(
                      0.0,
                      min(
                          best.score,
                          1.0,
                      ),
                  )

                  escalate = (
                      confidence
                      < ESCALATION_THRESHOLD
                  )

                  related = [
                      {
                          "id": item.article["id"],
                          "title": (
                              item.article["title"]
                          ),
                          "score": round(
                              item.score,
                              4,
                          ),
                      }
                      for item in results
                  ]

                  return {
                      "query": query,
                      "intent": intent,
                      "answer": (
                          article["summary"]
                      ),
                      "steps": (
                          article["steps"]
                      ),
                      "source": {
                          "id": article["id"],
                          "title": (
                              article["title"]
                          ),
                          "category": (
                              article["category"]
                          ),
                      },
                      "confidence": round(
                          confidence,
                          4,
                      ),
                      "escalation_recommended": (
                          escalate
                      ),
                      "related_articles": (
                          related
                      ),
                  }
          PYEOF

          # =========================================================
          # CLI
          # =========================================================

          cat > src/supportgpt/cli.py <<'PYEOF'
          """
          Interactive terminal client.
          """

          from .engine import SupportEngine


          def main():
              engine = SupportEngine()

              print(
                  "\nSupportGPT AI"
              )

              print(
                  "Technical Support Assistant"
              )

              print(
                  "Type 'exit' to quit.\n"
              )

              while True:
                  query = input(
                      "You > "
                  ).strip()

                  if query.lower() in {
                      "exit",
                      "quit",
                  }:
                      break

                  result = engine.answer(
                      query
                  )

                  print(
                      "\nSupportGPT > "
                      + result["answer"]
                  )

                  if result["steps"]:
                      print(
                          "\nSuggested steps:"
                      )

                      for index, step in (
                          enumerate(
                              result["steps"],
                              start=1,
                          )
                      ):
                          print(
                              f"{index}. {step}"
                          )

                  print(
                      "\nSource: "
                      + result["source"][
                          "title"
                      ]
                  )

                  print(
                      "Confidence: "
                      f"{result['confidence']:.2f}"
                  )

                  if result[
                      "escalation_recommended"
                  ]:
                      print(
                          "Escalation recommended."
                      )

                  print()


          if __name__ == "__main__":
              main()
          PYEOF

          # =========================================================
          # FASTAPI SERVICE
          # =========================================================

          cat > api.py <<'PYEOF'
          from fastapi import FastAPI
          from pydantic import BaseModel, Field

          from supportgpt.engine import (
              SupportEngine,
          )


          app = FastAPI(
              title="SupportGPT AI API",
              description=(
                  "Technical-support assistant "
                  "for software products."
              ),
              version="1.0.0",
          )

          engine = SupportEngine()


          class ChatRequest(BaseModel):
              message: str = Field(
                  min_length=1,
                  max_length=5000,
              )


          @app.get("/health")
          def health():
              return {
                  "status": "ok",
                  "service": "SupportGPT AI",
              }


          @app.post("/chat")
          def chat(request: ChatRequest):
              return engine.answer(
                  request.message
              )
          PYEOF

          # =========================================================
          # STREAMLIT APP
          # =========================================================

          cat > app.py <<'PYEOF'
          import streamlit as st

          from supportgpt.engine import (
              SupportEngine,
          )


          st.set_page_config(
              page_title="SupportGPT AI",
              page_icon="🤖",
              layout="wide",
          )


          @st.cache_resource
          def load_engine():
              return SupportEngine()


          engine = load_engine()


          st.title(
              "🤖 SupportGPT AI"
          )

          st.caption(
              "Intelligent technical support "
              "for software products"
          )


          if "messages" not in st.session_state:
              st.session_state.messages = []


          for message in (
              st.session_state.messages
          ):
              with st.chat_message(
                  message["role"]
              ):
                  st.markdown(
                      message["content"]
                  )


          prompt = st.chat_input(
              "Describe your software issue..."
          )


          if prompt:
              st.session_state.messages.append(
                  {
                      "role": "user",
                      "content": prompt,
                  }
              )

              with st.chat_message(
                  "user"
              ):
                  st.markdown(
                      prompt
                  )

              result = engine.answer(
                  prompt
              )

              response = (
                  result["answer"]
                  + "\n\n"
              )

              if result["steps"]:
                  response += (
                      "### Suggested steps\n"
                  )

                  for index, step in enumerate(
                      result["steps"],
                      start=1,
                  ):
                      response += (
                          f"{index}. {step}\n"
                      )

              response += (
                  "\n**Knowledge source:** "
                  + result["source"][
                      "title"
                  ]
              )

              if result[
                  "escalation_recommended"
              ]:
                  response += (
                      "\n\n⚠️ **Low retrieval "
                      "confidence — human "
                      "escalation recommended.**"
                  )

              with st.chat_message(
                  "assistant"
              ):
                  st.markdown(
                      response
                  )

              st.session_state.messages.append(
                  {
                      "role": "assistant",
                      "content": response,
                  }
              )
          PYEOF

          # =========================================================
          # SAMPLE KNOWLEDGE BASE
          # =========================================================

          cat > data/knowledge_base.json <<'JSONEOF'
          [
            {
              "id": "KB-001",
              "title": "Windows Installation Troubleshooting",
              "category": "installation",
              "keywords": [
                "windows",
                "installation",
                "installer",
                "setup",
                "administrator",
                "dependency"
              ],
              "summary": "Most Windows installation problems are caused by outdated installers, insufficient permissions, missing dependencies, or security software blocking setup.",
              "steps": [
                "Download the latest installer from the official product source.",
                "Run the installer as Administrator.",
                "Verify that the system meets the minimum requirements.",
                "Install any required runtime or dependency packages.",
                "Temporarily test whether security software is blocking installation.",
                "Review installer logs if the error continues."
              ]
            },
            {
              "id": "KB-002",
              "title": "API Authentication Troubleshooting",
              "category": "api_support",
              "keywords": [
                "api",
                "authentication",
                "token",
                "401",
                "403",
                "bearer"
              ],
              "summary": "API authentication errors commonly result from missing, expired, malformed, or incorrectly scoped credentials.",
              "steps": [
                "Confirm the API key or access token is valid.",
                "Verify the Authorization header format.",
                "Check token expiration.",
                "Confirm the credential has permission for the requested endpoint.",
                "Check whether the API base URL and environment are correct."
              ]
            },
            {
              "id": "KB-003",
              "title": "Application Performance Troubleshooting",
              "category": "performance",
              "keywords": [
                "slow",
                "performance",
                "cpu",
                "memory",
                "latency",
                "timeout"
              ],
              "summary": "Performance problems should be isolated by checking resource utilization, logs, network latency, application version, and workload size.",
              "steps": [
                "Check CPU and memory utilization.",
                "Review application logs for repeated warnings or exceptions.",
                "Confirm the software is updated.",
                "Test network latency when the product depends on remote services.",
                "Reduce workload size temporarily to isolate scaling problems."
              ]
            },
            {
              "id": "KB-004",
              "title": "Configuration and Environment Issues",
              "category": "configuration",
              "keywords": [
                "configuration",
                "config",
                "environment",
                "settings",
                "variable",
                "path"
              ],
              "summary": "Configuration problems often come from incorrect environment values, file paths, ports, permissions, or stale cached settings.",
              "steps": [
                "Verify required environment variables.",
                "Confirm configuration file paths.",
                "Check port and host values.",
                "Restart the application after changing configuration.",
                "Compare the configuration with the supplied example file."
              ]
            },
            {
              "id": "KB-005",
              "title": "Password and Login Recovery",
              "category": "account",
              "keywords": [
                "login",
                "password",
                "reset",
                "account",
                "credential",
                "username"
              ],
              "summary": "Login problems can usually be resolved by verifying the account identifier, resetting the password, and checking whether the account is locked or disabled.",
              "steps": [
                "Confirm the correct username or email address.",
                "Use the official password-reset process.",
                "Check whether Caps Lock or keyboard layout is affecting the password.",
                "Verify that the account is active.",
                "Contact an administrator if the account remains locked."
              ]
            }
          ]
          JSONEOF

          # =========================================================
          # TESTS
          # =========================================================

          cat > tests/test_intent.py <<'PYEOF'
          from supportgpt.intent import (
              detect_intent,
          )


          def test_installation_intent():
              assert (
                  detect_intent(
                      "The installer fails "
                      "during setup"
                  )
                  == "installation"
              )


          def test_api_intent():
              assert (
                  detect_intent(
                      "My API token returns 401"
                  )
                  == "api_support"
              )
          PYEOF

          cat > tests/test_engine.py <<'PYEOF'
          from supportgpt.engine import (
              SupportEngine,
          )


          def test_engine_returns_source():
              engine = SupportEngine()

              result = engine.answer(
                  "Installation fails on Windows"
              )

              assert "answer" in result

              assert "source" in result

              assert len(
                  result["steps"]
              ) > 0


          def test_engine_has_confidence():
              engine = SupportEngine()

              result = engine.answer(
                  "How do I fix API authentication?"
              )

              assert (
                  0.0
                  <= result["confidence"]
                  <= 1.0
              )
          PYEOF

          # =========================================================
          # REQUIREMENTS
          # =========================================================

          cat > requirements.txt <<'EOF'
          scikit-learn>=1.5
          fastapi>=0.115
          uvicorn[standard]>=0.30
          streamlit>=1.37
          pydantic>=2.8
          pytest>=8.3
          jupyter>=1.0
          EOF

          # =========================================================
          # PYPROJECT
          # =========================================================

          cat > pyproject.toml <<'EOF'
          [build-system]
          requires = ["setuptools>=68", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "supportgpt-ai"
          version = "1.0.0"
          description = "Intelligent technical-support assistant for software products"
          requires-python = ">=3.10"
          dependencies = [
            "scikit-learn>=1.5",
            "fastapi>=0.115",
            "uvicorn[standard]>=0.30",
            "streamlit>=1.37",
            "pydantic>=2.8"
          ]

          [project.scripts]
          supportgpt = "supportgpt.cli:main"

          [tool.setuptools.packages.find]
          where = ["src"]

          [tool.pytest.ini_options]
          pythonpath = ["src"]
          testpaths = ["tests"]
          EOF

          # =========================================================
          # GITIGNORE
          # =========================================================

          cat > .gitignore <<'EOF'
          # Python
          __pycache__/
          *.py[cod]
          *.egg-info/
          build/
          dist/

          # Virtual environments
          .venv/
          venv/
          env/

          # Jupyter
          .ipynb_checkpoints/

          # Environment secrets
          .env
          .env.*

          # IDE
          .vscode/
          .idea/

          # OS
          .DS_Store
          Thumbs.db

          # Runtime / logs
          logs/
          *.log

          # Local ticket data
          tickets/
          EOF

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        run: |
          pytest -q

      - name: Validate Python
        run: |
          python -m compileall src api.py app.py tests

      - name: Commit generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Repository already up to date."
          else
            git commit -m "feat: build complete SupportGPT AI support platform"
            git push
          fi
